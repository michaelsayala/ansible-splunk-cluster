---
- name: Splunk SSL Web - Create Splunk certificate directory
  file:
    path: "{{ splunk_home }}/etc/auth/{{ splunk_cert_dir }}"
    state: directory
    owner: splunk
    group: splunk
    mode: "0755"

- name: Splunk SSL Web - Copy TLS certificate chain
  ansible.builtin.copy:
    src: certificates/fullchain.pem
    dest: "{{ splunk_home }}/etc/auth/{{ splunk_cert_dir }}/fullchain.pem"
    owner: splunk
    group: splunk
    mode: "0644"

- name: Splunk SSL Web - Copy TLS private key
  ansible.builtin.copy:
    src: certificates/privkey.pem
    dest: "{{ splunk_home }}/etc/auth/{{ splunk_cert_dir }}/privkey.pem"
    owner: splunk
    group: splunk
    mode: "0600"