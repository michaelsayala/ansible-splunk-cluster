---
- name: OS - Create THP systemd service
  ansible.builtin.template:
    src: disable-thp.service.j2
    dest: /etc/systemd/system/disable-thp.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd

- name: OS - Enable disable-thp service
  ansible.builtin.systemd:
    name: disable-thp.service
    enabled: true
    state: started