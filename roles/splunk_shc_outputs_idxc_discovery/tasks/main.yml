---
- name: Deployer - Create app directory structure
  ansible.builtin.file:
    path: "{{ splunk_home }}/etc/shcluster/apps/splunk_outputs_idxc_discovery/local"
    state: directory
    owner: splunk
    group: splunk
    mode: "0755"

- name: Deployer - Deploy outputs.conf
  ansible.builtin.template:
    src: outputs.conf.j2
    dest: "{{ splunk_home }}/etc/shcluster/apps/splunk_outputs_idxc_discovery/local/outputs.conf"
    owner: splunk
    group: splunk
    mode: "0644"
  notify:
    - Apply SHC Bundle

- name: Deployer - Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Deployer - Wait for Splunk Management Port
  ansible.builtin.include_role:
    name: splunk_common
    tasks_from: wait_for_splunk_management_port.yml

- name: Deployer - Wait for Splunk REST API
  ansible.builtin.include_role:
    name: splunk_common
    tasks_from: wait_for_splunk_rest_api.yml