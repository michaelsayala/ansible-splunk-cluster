---
- name: Indexer Receiving - Enable receiving port (inputs.conf)
  ansible.builtin.template:
    src: inputs.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/inputs.conf"
    owner: splunk
    group: splunk
    mode: "0644"
  notify:
    - Restart Splunk

- name: Indexer Receiving  - Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Indexer Receiving  - Wait for Splunk Management Port
  ansible.builtin.include_role:
    name: splunk_common
    tasks_from: wait_for_splunk_management_port.yml

- name: Indexer Receiving  - Wait for Splunk REST API
  ansible.builtin.include_role:
    name: splunk_common
    tasks_from: wait_for_splunk_rest_api.yml