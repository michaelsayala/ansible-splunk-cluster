---
- name: License Peer - Configure license manager
  ansible.builtin.command: >
    {{ splunk_home }}/bin/splunk edit licenser-localslave
    -master_uri https://{{ hostvars['lm1']['private_ip'] }}:8089
    -auth {{ splunk_admin_user }}:{{ splunk_admin_password }}
  register: splunk_license_peer
  changed_when: splunk_license_peer.rc == 0
  notify:
    - Restart Splunk